project:
  type: website
  output-dir: _site
  render:
    - README.md
    - compare.qmd
  # Demo pages and their images are copied to the site as-is.
  # CI downloads the images and runs ssio on test/img before rendering.
  resources:
    - test/index.html
    - test/index_compressed.html
    - test/img/*.jpg
    - test/img/*.png
    - test/img/*.webp

site-url: "https://toledoem.github.io/StaticSiteImageOptimizer/"

website:
  title: "Static Site Image Optimizer"
  navbar:
    left:
      - text: "Original vs WebP"
        href: compare.qmd
      - text: "Repository"
        href: "https://github.com/ToledoEM/StaticSiteImageOptimizer"

format:
  html:
    theme:
      light: flatly # Bootswatch theme (Bootstrap look)
    includes:
      in_header: |
        <script data-goatcounter="https://etoledo.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
    toc: true
    toc-location: left
    toc-depth: 4
    toc-expand: 2
